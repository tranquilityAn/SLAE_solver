<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="SLAE Solver Logo">
  <title>SLAE Solver</title>
  <!-- Колір можна змінити через властивість color -->
  <g style="color:#2A9D8F">
    <!-- Рамка-матриця -->
    <rect x="6" y="6" width="52" height="52" rx="10" stroke="currentColor" stroke-width="4"/>
    <!-- Лінії сітки 2x2 -->
    <line x1="32" y1="10" x2="32" y2="54" stroke="currentColor" stroke-width="3" stroke-linecap="round" opacity="0.55"/>
    <line x1="10" y1="32" x2="54" y2="32" stroke="currentColor" stroke-width="3" stroke-linecap="round" opacity="0.55"/>
    <!-- Стрілки до центру (лаконічні "штрихи") -->
    <line x1="12" y1="32" x2="22" y2="32" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
    <line x1="52" y1="32" x2="42" y2="32" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
    <line x1="32" y1="12" x2="32" y2="22" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
    <line x1="32" y1="52" x2="32" y2="42" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
    <!-- Точка-розв'язок у центрі -->
    <circle cx="32" cy="32" r="4" fill="currentColor"/>
  </g>
</svg>
